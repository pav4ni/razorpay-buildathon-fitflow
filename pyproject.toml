[project]
name = "fitflow-agent"
version = "0.1.0"
description = "AI-powered conversational checkout agent for fitness & athleisure — Razorpay Buildathon entry"
# 3.9 is the floor because that is what ships with macOS and what the verified
# venv runs. Nothing in this codebase uses 3.10+ syntax.
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40",
    "razorpay>=2.0",
    "flask>=3.0",
    "flask-cors>=4.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "requests>=2.31",
]
